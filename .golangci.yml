version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - ineffassign
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - prealloc
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - copyloopvar
          - errcheck
          - gosec
          - nilnil
          - noctx
          - prealloc
          - staticcheck
          - testifylint
          - unparam
      - path: internal/entry/cli/io\.go
        linters:
          - gosec
        text: "G30[16]:"
  settings:
    depguard:
      rules:
        adapters:
          files:
            - internal/adapter/**/*.go
            - "!$test"
          deny:
            - pkg: github.com/kuuvahki-labs/sandrone/internal/entry
              desc: adapters must not depend on entrypoints
            - pkg: github.com/kuuvahki-labs/sandrone/internal/store
              desc: adapters must not access resource storage
        processors:
          files:
            - internal/processor/**/*.go
            - "!$test"
          deny:
            - pkg: github.com/kuuvahki-labs/sandrone/internal/adapter
              desc: processors must operate on canonical domain values
            - pkg: github.com/kuuvahki-labs/sandrone/internal/entry
              desc: processors must not depend on entrypoints
            - pkg: github.com/kuuvahki-labs/sandrone/internal/store
              desc: processors must not access resource storage
        orchestration:
          files:
            - internal/domain/**/*.go
            - internal/service/**/*.go
            - "!$test"
          deny:
            - pkg: github.com/kuuvahki-labs/sandrone/internal/entry
              desc: domain and service must not depend on entrypoints
        file-drivers:
          files:
            - internal/filedriver/**/*.go
            - "!$test"
          deny:
            - pkg: github.com/kuuvahki-labs/sandrone/internal/entry
              desc: file drivers must not depend on entrypoints
            - pkg: github.com/kuuvahki-labs/sandrone/internal/processor
              desc: file drivers must not execute processor pipelines
            - pkg: github.com/kuuvahki-labs/sandrone/internal/service
              desc: file drivers must not depend on service orchestration
            - pkg: github.com/kuuvahki-labs/sandrone/internal/store
              desc: file drivers must not access resource storage
        catalogs:
          files:
            - internal/agentcatalog/**/*.go
            - "!$test"
          deny:
            - pkg: github.com/kuuvahki-labs/sandrone/internal/service
              desc: catalogs consume leaf contracts instead of service internals
    errcheck:
      check-type-assertions: true
      check-blank: false
    gosec:
      excludes:
        - G304 # File paths are validated at service/store boundaries where required.
    govet:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: receiver-naming
        - name: superfluous-else
        - name: unexported-return
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
    testifylint:
      enable-all: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kuuvahki-labs/sandrone

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
