<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Sandrone social preview</title>
  <desc id="description">The self-hosted proxy configuration workbench.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.52" stop-color="#0e1728"/>
      <stop offset="1" stop-color="#101b31"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f9bff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2f9bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8bbcff" stroke-opacity="0.055"/>
    </pattern>
    <filter id="logo-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000b1f" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="1004" cy="314" rx="390" ry="360" fill="url(#glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(88 86)">
      <rect width="172" height="42" rx="21" fill="#56adff" fill-opacity="0.13" stroke="#72baff" stroke-opacity="0.44"/>
      <circle cx="23" cy="21" r="5" fill="#63b4ff"/>
      <text x="40" y="27" fill="#a9d6ff" font-size="15" font-weight="650" letter-spacing="1.4">SELF-HOSTED</text>
    </g>

    <text x="84" y="238" fill="#f4f8ff" font-size="82" font-weight="780" letter-spacing="-3">Sandrone</text>
    <text x="88" y="300" fill="#8ec8ff" font-size="31" font-weight="620">The proxy configuration workbench.</text>
    <text x="88" y="364" fill="#b9c8db" font-size="22" font-weight="450">Aggregate subscriptions. Shape nodes.</text>
    <text x="88" y="398" fill="#b9c8db" font-size="22" font-weight="450">Ship client-ready configs.</text>

    <g transform="translate(88 470)" fill="#dce9f8" font-size="17" font-weight="560">
      <rect width="118" height="42" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="18" y="27">Mihomo</text>
      <g transform="translate(132)">
        <rect width="120" height="42" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="17" y="27">sing-box</text>
      </g>
      <g transform="translate(266)">
        <rect width="154" height="42" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="16" y="27">Shadowrocket</text>
      </g>
    </g>

    <text x="88" y="570" fill="#71849d" font-size="15" font-weight="600" letter-spacing="2">WEB UI · CLI · HTTP API · MCP · GO</text>
  </g>

  <g filter="url(#logo-shadow)">
    <circle cx="1010" cy="317" r="226" fill="#111c2e" stroke="#64b5ff" stroke-opacity="0.16" stroke-width="2"/>
    <image href="../docs/sandrone.png" x="798" y="105" width="424" height="424" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
