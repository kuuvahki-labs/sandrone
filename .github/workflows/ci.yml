name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify Go modules
        run: go mod verify

      - name: Run Go checks
        run: make check

  web:
    name: Web UI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Web UI
        run: pnpm typecheck

      - name: Lint Web UI
        run: pnpm lint

      - name: Test Web UI
        run: pnpm test:run

      - name: Test built Web UI in Chromium
        run: pnpm test:e2e

  build-webui:
    name: Build embedded Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build Web UI assets
        run: make build-webui

      - name: Build project
        run: make build

  container-image:
    name: Container image
    runs-on: ubuntu-latest
    concurrency:
      group: container-image-${{ github.event_name == 'push' && 'publish' || github.run_id }}
      cancel-in-progress: false
      queue: max
    needs:
      - go
      - web
      - build-webui
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kuuvahki-labs/sandrone
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build container image
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          make image SANDRONE_IMAGE="${IMAGE}:sha-${short_sha}" REVISION="${GITHUB_SHA}"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push container image
        if: github.event_name == 'push'
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          source_image="${IMAGE}:sha-${short_sha}"
          git fetch --force --tags origin
          publish_tags="$(./scripts/container-image-tags.sh)"
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            if [[ "${tag}" != "${source_image}" ]]; then
              docker tag "${source_image}" "${tag}"
            fi
            docker push "${tag}"
          done <<< "${publish_tags}"
