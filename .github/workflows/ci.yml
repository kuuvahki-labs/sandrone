name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify Go modules
        run: go mod verify

      - name: Run Go checks
        run: make check

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Run Go lint
        run: make lint

  web:
    name: Web UI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Web UI
        run: pnpm typecheck

      - name: Lint Web UI
        run: pnpm lint

      - name: Test Web UI
        run: pnpm test:run

      - name: Test built Web UI in Chromium
        run: pnpm test:e2e

  container-check:
    name: Container image
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/kuuvahki-labs/sandrone
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image version
        id: image-metadata
        shell: bash
        run: |
          version="$(tr -d '\r\n' < internal/buildinfo/VERSION)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=sandrone-container
          cache-to: type=gha,mode=max,scope=sandrone-container
          build-args: |
            VERSION=${{ steps.image-metadata.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.image-metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  container-publish:
    name: Publish container image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: container-image-publish
      cancel-in-progress: false
      queue: max
    needs:
      - go
      - web
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kuuvahki-labs/sandrone
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve image metadata
        id: image-metadata
        shell: bash
        run: |
          version="$(tr -d '\r\n' < internal/buildinfo/VERSION)"
          git fetch --force --tags origin
          tags="$(./scripts/container-image-tags.sh)"
          {
            echo "version=${version}"
            echo 'tags<<EOF'
            echo "${tags}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-metadata.outputs.tags }}
          cache-from: type=gha,scope=sandrone-container
          cache-to: type=gha,mode=max,scope=sandrone-container
          build-args: |
            VERSION=${{ steps.image-metadata.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.image-metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: github-release-publish
      cancel-in-progress: false
      queue: max
    needs:
      - go
      - web
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: sh ./scripts/validate-release-tag.sh

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build release artifacts
        run: make release-artifacts REVISION="${GITHUB_SHA}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          artifacts=(
            "dist/sandrone_linux_amd64.tar.gz"
            "dist/sandrone_linux_arm64.tar.gz"
            "dist/checksums.txt"
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${artifacts[@]}" --clobber
          else
            prerelease_flag=""
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              prerelease_flag="--prerelease"
            fi
            gh release create "${GITHUB_REF_NAME}" "${artifacts[@]}" --verify-tag --generate-notes ${prerelease_flag}
          fi
