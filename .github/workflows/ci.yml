name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify Go modules
        run: go mod verify

      - name: Run Go checks
        run: make check

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Run Go lint
        run: make lint

  web:
    name: Web UI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Web UI
        run: pnpm typecheck

      - name: Lint Web UI
        run: pnpm lint

      - name: Test Web UI
        run: pnpm test:run

      - name: Test built Web UI in Chromium
        run: pnpm test:e2e

  build-webui:
    name: Build embedded Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build Web UI assets
        run: make build-webui

      - name: Build project
        run: make build

  container-image:
    name: Container image
    runs-on: ubuntu-latest
    concurrency:
      group: container-image-${{ github.event_name == 'push' && 'publish' || github.run_id }}
      cancel-in-progress: false
      queue: max
    needs:
      - go
      - web
      - build-webui
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kuuvahki-labs/sandrone
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image metadata
        id: image-metadata
        shell: bash
        run: |
          version="$(tr -d '\r\n' < internal/buildinfo/VERSION)"
          tags="${IMAGE}:ci"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch --force --tags origin
            tags="$(./scripts/container-image-tags.sh)"
          fi
          {
            echo "version=${version}"
            echo 'tags<<EOF'
            echo "${tags}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          tags: ${{ steps.image-metadata.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image-metadata.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.image-metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  release:
    name: GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs:
      - container-image
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build Web UI assets
        run: make build-webui

      - name: Build release artifacts
        run: make release-artifacts REVISION="${GITHUB_SHA}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="$(tr -d '\r\n' < internal/buildinfo/VERSION)"
          artifacts=(
            "dist/sandrone_${version}_linux_amd64.tar.gz"
            "dist/sandrone_${version}_linux_arm64.tar.gz"
            "dist/checksums.txt"
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${artifacts[@]}" --clobber
          else
            prerelease_flag=""
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              prerelease_flag="--prerelease"
            fi
            gh release create "${GITHUB_REF_NAME}" "${artifacts[@]}" --verify-tag --generate-notes ${prerelease_flag}
          fi
