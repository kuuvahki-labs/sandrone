name: Web UI full tests

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ui-full
  cancel-in-progress: true

jobs:
  web-full:
    name: Web UI full tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Test full Web UI suite
        run: pnpm test:run
